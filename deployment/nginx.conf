# /etc/nginx/conf.d/douyin-bot.conf
# 建议使用 certbot 配置 HTTPS：
#   yum install -y certbot python3-certbot-nginx
#   certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name your-domain.com;

    # 企业微信验签（GET）与消息回调（POST）。
    location = /callback {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # 其他 Bot 路径默认不对公网暴露。
    location / {
        return 404;
    }

    # MCP 默认只监听 127.0.0.1:8090，且不配置公网路由。
    # 若确需远程访问，必须先启用 HTTPS 和认证，再按需添加下方示例；
    # 不要直接把 8090 端口加入安全组或防火墙白名单。
    # 创建密码文件：htpasswd -c /etc/nginx/.douyin-mcp.htpasswd your_user
    #
    # location /mcp {
    #     auth_basic "Douyin MCP";
    #     auth_basic_user_file /etc/nginx/.douyin-mcp.htpasswd;
    #     proxy_pass http://127.0.0.1:8090;
    #     proxy_http_version 1.1;
    #     proxy_buffering off;
    #     proxy_read_timeout 300s;
    # }
}
